<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#02080d" />
<title>圣诞树 · Merry Christmas</title>
<style>
  :root {
    --gold-1: #8a6b2c;
    --gold-2: #ffe9a8;
    --gold-3: #fff6d8;
    --gold-4: #ffc861;
    --ink: #02080d;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: var(--ink);
    color: #fff;
    font-family: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }

  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
  }

  #scene.dragging { cursor: grabbing; }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 78% 62% at 50% 42%, transparent 34%, rgba(1, 5, 9, 0.42) 78%, rgba(1, 4, 7, 0.82) 100%),
      linear-gradient(180deg, rgba(3, 12, 18, 0.28) 0%, transparent 22%, transparent 74%, rgba(1, 5, 9, 0.72) 100%);
    mix-blend-mode: multiply;
    z-index: 1;
  }

  .ui {
    animation: uiIn 2.4s cubic-bezier(0.22, 0.8, 0.24, 1) 0.55s both;
    position: fixed;
    left: 0;
    right: 0;
    bottom: clamp(26px, 7.2vh, 76px);
    z-index: 3;
    text-align: center;
    pointer-events: none;
    padding: 0 24px;
    user-select: none;
  }

  .ui h1 {
    margin: 0;
    font-family: "Didot", "Bodoni MT", "Playfair Display", Georgia, "Times New Roman", serif;
    font-weight: 400;
    font-size: clamp(26px, 4.9vw, 62px);
    line-height: 1.08;
    letter-spacing: 0.16em;
    text-indent: 0.16em;
    text-transform: uppercase;
    background: linear-gradient(
      104deg,
      var(--gold-1) 0%,
      var(--gold-2) 15%,
      var(--gold-3) 30%,
      var(--gold-4) 44%,
      #b98a3a 56%,
      var(--gold-2) 72%,
      #f4cf78 86%,
      var(--gold-1) 100%
    );
    background-size: 240% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 16px rgba(255, 194, 92, 0.28)) drop-shadow(0 2px 14px rgba(0, 0, 0, 0.55));
    animation: shimmer 11s linear infinite;
  }

  .rule {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: clamp(12px, 1.8vh, 20px) auto clamp(10px, 1.6vh, 16px);
    width: min(340px, 62vw);
    opacity: 0.72;
  }

  .rule::before,
  .rule::after {
    content: "";
    height: 1px;
    flex: 1;
    background: linear-gradient(90deg, transparent, rgba(255, 216, 150, 0.55), transparent);
  }

  .rule i {
    width: 5px;
    height: 5px;
    transform: rotate(45deg);
    background: #ffe1a0;
    box-shadow: 0 0 10px rgba(255, 205, 120, 0.9);
  }

  .ui p {
    margin: 0;
    font-size: clamp(11px, 1.16vw, 14px);
    letter-spacing: 0.52em;
    text-indent: 0.52em;
    color: rgba(255, 240, 214, 0.6);
    text-shadow: 0 0 18px rgba(255, 190, 100, 0.25);
  }

  .hint {
    position: fixed;
    left: 50%;
    bottom: max(14px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    z-index: 3;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 10.5px;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    color: rgba(210, 236, 240, 0.34);
    pointer-events: none;
    user-select: none;
    white-space: nowrap;
    transition: opacity 1.2s ease 3s;
  }

  .hint.fade { opacity: 0.12; }

  @keyframes shimmer {
    0% { background-position: 0% 50%; }
    100% { background-position: 240% 50%; }
  }

  @keyframes uiIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    .ui { animation: none; }
    .ui h1 { animation: none; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="发光的电子圣诞树动画"></canvas>
<div class="vignette"></div>

<div class="ui">
  <h1>Merry Christmas</h1>
  <div class="rule"><i></i></div>
  <p>圣诞快乐 · 平安喜乐</p>
</div>
<div class="hint" id="hint">拖动旋转 · 点击许愿</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d', { alpha: false });
  const bloom = document.createElement('canvas');
  const bctx = bloom.getContext('2d');
  const bgCanvas = document.createElement('canvas');
  const bgCtx = bgCanvas.getContext('2d');
  const hint = document.getElementById('hint');

  const TAU = Math.PI * 2;
  const rand = (min, max) => min + Math.random() * (max - min);
  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const smooth = (t) => t * t * (3 - 2 * t);

  let W = window.innerWidth;
  let H = window.innerHeight;
  let DPR = 1;
  let scale = 500;
  let cx = W / 2;
  let cy = H * 0.44;

  const CAM_Z = 3.0;
  const FOCAL = 2.6;
  const TREE_TOP = 0.62;
  const START = performance.now();
  const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const AUTO_SPIN = REDUCED ? 0.09 : 0.34;

  let points = [];
  let stars = [];
  let snow = [];
  let wishes = [];
  let view = [];

  let rotY = 0;
  let tilt = 0.09;
  let spinVel = 0.34;
  let dragging = false;
  let moved = false;
  let lastX = 0;
  let lastY = 0;
  let flash = 0;
  let pointerX = 0;
  let pointerY = 0;

  const ORNAMENT_COLORS = ['#ff5d73', '#ffca6b', '#7fe3ff', '#ff8fd8', '#fff4d6', '#a98bff'];
  const ORNAMENT_RGB = ORNAMENT_COLORS.map((hex) => {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  });

  const STRAND_HUES = [44, 152, 46, 196, 336, 158, 40, 174, 288];
  const ACCENT_HUES = [336, 196, 44, 288, 8];
  const strandBuf = Array.from({ length: STRAND_HUES.length }, () => []);

  const spriteCache = new Map();
  const hueSprites = new Map();
  let snowSprite = null;

  function hueSprite(hue, sat, light) {
    const hq = ((Math.round(hue / 8) * 8) % 360 + 360) % 360;
    const key = hq + ':' + sat + ':' + light;
    let c = hueSprites.get(key);
    if (c) return c;

    c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0, `hsla(${hq},100%,93%,0.98)`);
    grd.addColorStop(0.14, `hsla(${hq},${sat}%,${Math.min(96, light + 30)}%,0.95)`);
    grd.addColorStop(0.36, `hsla(${hq},${sat}%,${light}%,0.46)`);
    grd.addColorStop(0.64, `hsla(${hq},${sat}%,${light}%,0.13)`);
    grd.addColorStop(1, `hsla(${hq},${sat}%,${light}%,0)`);
    g.fillStyle = grd;
    g.fillRect(0, 0, 64, 64);
    hueSprites.set(key, c);
    return c;
  }

  function rgbSprite(rgb) {
    const key = rgb.join(',');
    let c = spriteCache.get(key);
    if (c) return c;

    c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const [r, gr, b] = rgb;
    const grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grd.addColorStop(0, 'rgba(255,255,255,0.99)');
    grd.addColorStop(0.15, `rgba(${r},${gr},${b},0.96)`);
    grd.addColorStop(0.37, `rgba(${r},${gr},${b},0.44)`);
    grd.addColorStop(0.66, `rgba(${r},${gr},${b},0.12)`);
    grd.addColorStop(1, `rgba(${r},${gr},${b},0)`);
    g.fillStyle = grd;
    g.fillRect(0, 0, 64, 64);
    spriteCache.set(key, c);
    return c;
  }

  function getSnowSprite() {
    if (snowSprite) return snowSprite;
    snowSprite = document.createElement('canvas');
    snowSprite.width = snowSprite.height = 32;
    const g = snowSprite.getContext('2d');
    const grd = g.createRadialGradient(16, 16, 0, 16, 16, 16);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(0.3, 'rgba(226,244,255,0.82)');
    grd.addColorStop(0.62, 'rgba(206,234,255,0.28)');
    grd.addColorStop(1, 'rgba(200,232,255,0)');
    g.fillStyle = grd;
    g.fillRect(0, 0, 32, 32);
    return snowSprite;
  }

  function buildTree() {
    points = [];
    view = [];

    const STRANDS = 9;
    const TURNS = 5.4;
    const PER = 150;
    const RAD = 0.40;
    const BOTTOM = -0.53;
    const HEIGHT = 1.06;

    for (let s = 0; s < STRANDS; s++) {
      for (let i = 0; i < PER; i++) {
        const t = i / (PER - 1);
        const radius = RAD * Math.pow(1 - t, 0.94) * (0.95 + 0.05 * Math.sin(t * Math.PI));
        const ang = s * (TAU / STRANDS) + t * TURNS * TAU;
        const jitter = 0.011;

        points.push({
          x: Math.cos(ang) * radius + rand(-jitter, jitter),
          y: BOTTOM + t * HEIGHT + rand(-0.006, 0.006),
          z: Math.sin(ang) * radius + rand(-jitter, jitter),
          strand: s,
          accentHue: i % 14 === 0 ? ACCENT_HUES[((i / 14 + s) % ACCENT_HUES.length) | 0] : null,
          hue: STRAND_HUES[s % STRAND_HUES.length] + t * 6 + rand(-4, 4),
          size: i % 6 === 0 ? 0.0205 + rand(-0.002, 0.003) : 0.0115 + rand(-0.0015, 0.002),
          alpha: i % 6 === 0 ? 1 : 0.72,
          phase: Math.random() * TAU,
          speed: rand(1.1, 2.6),
          delay: t * 0.42,
          kind: 0
        });
      }
    }

    for (let i = 0; i < 2100; i++) {
      const t = Math.pow(Math.random(), 0.82);
      const radius = RAD * Math.pow(1 - t, 0.94) * rand(0.42, 1.0);
      const ang = Math.random() * TAU;
      points.push({
        x: Math.cos(ang) * radius,
        y: BOTTOM + t * HEIGHT,
        z: Math.sin(ang) * radius,
        hue: rand(138, 176),
        size: rand(0.0045, 0.012),
        alpha: 0.34,
        phase: Math.random() * TAU,
        speed: rand(0.6, 1.8),
        delay: t * 0.42,
        kind: 1
      });
    }

    for (let i = 0; i < 320; i++) {
      const t = Math.pow(Math.random(), 1.3);
      const radius = RAD * Math.pow(1 - t, 0.94) * rand(0, 0.55);
      const ang = Math.random() * TAU;
      points.push({
        x: Math.cos(ang) * radius,
        y: BOTTOM + t * HEIGHT,
        z: Math.sin(ang) * radius,
        hue: rand(34, 48),
        size: rand(0.004, 0.009),
        alpha: 0.22,
        phase: Math.random() * TAU,
        speed: rand(0.5, 1.2),
        delay: t * 0.42,
        kind: 1
      });
    }

    for (let i = 0; i < 150; i++) {
      const t = Math.pow(Math.random(), 0.72);
      const radius = RAD * Math.pow(1 - t, 0.94) * rand(0.9, 1.04);
      const ang = Math.random() * TAU;
      points.push({
        x: Math.cos(ang) * radius,
        y: BOTTOM + t * HEIGHT,
        z: Math.sin(ang) * radius,
        colorIndex: (Math.random() * ORNAMENT_COLORS.length) | 0,
        size: rand(0.024, 0.036),
        alpha: 1,
        phase: Math.random() * TAU,
        speed: rand(0.8, 2.0),
        delay: t * 0.42,
        kind: 2
      });
    }

    for (const p of points) {
      view.push({ p, sx: 0, sy: 0, z: 0, size: 0, alpha: 0 });
    }
  }

  function buildStars() {
    stars = [];
    const count = Math.round(Math.min(190, (W * H) / 9000));
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.82,
        r: rand(0.4, 1.5),
        a: rand(0.15, 0.7),
        phase: Math.random() * TAU,
        speed: rand(0.4, 1.4)
      });
    }
  }

  function makeFlake(anywhere) {
    const depth = rand(0.15, 1);
    return {
      x: Math.random() * W,
      y: anywhere ? Math.random() * H : rand(-40, -4),
      depth,
      r: 0.7 + depth * 3.1,
      vy: 10 + depth * 44,
      sway: rand(6, 26) * depth,
      phase: Math.random() * TAU,
      speed: rand(0.35, 1.1),
      a: 0.18 + depth * 0.55
    };
  }

  function buildSnow() {
    const count = clamp(Math.round((W * H) / 6800), 90, 260);
    snow = [];
    for (let i = 0; i < count; i++) snow.push(makeFlake(true));
  }

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    bloom.width = Math.max(1, Math.round(W / 4));
    bloom.height = Math.max(1, Math.round(H / 4));

    bgCanvas.width = canvas.width;
    bgCanvas.height = canvas.height;
    bgCtx.setTransform(DPR, 0, 0, DPR, 0, 0);

    cx = W / 2;
    cy = H * 0.44;
    scale = Math.min(H * 0.60, W * 0.92);

    buildStars();
    buildSnow();
    buildBackground();
  }

  function project(x, y, z, cosY, sinY, cosT, sinT) {
    const x1 = x * cosY + z * sinY;
    const z1 = z * cosY - x * sinY;
    const y2 = y * cosT - z1 * sinT;
    const z2 = y * sinT + z1 * cosT;
    const persp = FOCAL / (CAM_Z - z2);
    return {
      sx: cx + x1 * persp * scale + pointerX * 10,
      sy: cy - y2 * persp * scale,
      z: z2,
      k: persp * scale
    };
  }

  function buildBackground() {
    const g = bgCtx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#05131c');
    g.addColorStop(0.42, '#031019');
    g.addColorStop(0.78, '#020a10');
    g.addColorStop(1, '#01060a');
    bgCtx.fillStyle = g;
    bgCtx.fillRect(0, 0, W, H);

    bgCtx.globalCompositeOperation = 'lighter';

    const warm = bgCtx.createRadialGradient(cx, H * 0.88, 0, cx, H * 0.88, Math.max(W, H) * 0.42);
    warm.addColorStop(0, 'rgba(96,54,26,0.10)');
    warm.addColorStop(1, 'rgba(40,20,8,0)');
    bgCtx.fillStyle = warm;
    bgCtx.fillRect(0, 0, W, H);

    const halo = bgCtx.createRadialGradient(cx, cy + scale * 0.12, 0, cx, cy + scale * 0.12, scale * 0.92);
    halo.addColorStop(0, 'rgba(26,86,78,0.13)');
    halo.addColorStop(0.55, 'rgba(14,44,48,0.06)');
    halo.addColorStop(1, 'rgba(6,20,26,0)');
    bgCtx.fillStyle = halo;
    bgCtx.fillRect(0, 0, W, H);

    const baseY = cy + 0.53 * (FOCAL / CAM_Z) * scale;
    bgCtx.save();
    bgCtx.translate(cx, baseY + scale * 0.015);
    bgCtx.scale(1, 0.24);
    const groundGlow = bgCtx.createRadialGradient(0, 0, 0, 0, 0, scale * 0.72);
    groundGlow.addColorStop(0, 'rgba(255,198,124,0.16)');
    groundGlow.addColorStop(0.38, 'rgba(140,196,150,0.07)');
    groundGlow.addColorStop(1, 'rgba(24,44,34,0)');
    bgCtx.fillStyle = groundGlow;
    bgCtx.beginPath();
    bgCtx.arc(0, 0, scale * 0.72, 0, TAU);
    bgCtx.fill();
    bgCtx.restore();

    const aurora = bgCtx.createRadialGradient(cx, H * 0.26, 0, cx, H * 0.26, Math.max(W, H) * 0.55);
    aurora.addColorStop(0, 'rgba(22,96,90,0.09)');
    aurora.addColorStop(0.5, 'rgba(14,60,68,0.04)');
    aurora.addColorStop(1, 'rgba(8,20,30,0)');
    bgCtx.fillStyle = aurora;
    bgCtx.beginPath();
    bgCtx.arc(cx, H * 0.26, Math.max(W, H) * 0.55, 0, TAU);
    bgCtx.fill();

    const spr = getSnowSprite();
    for (const s of stars) {
      const size = s.r * 7;
      bgCtx.globalAlpha = s.a * 0.62;
      bgCtx.drawImage(spr, s.x - size / 2, s.y - size / 2, size, size);
    }
    bgCtx.globalAlpha = 1;
    bgCtx.globalCompositeOperation = 'source-over';
  }

  function drawBackground(t) {
    ctx.drawImage(bgCanvas, 0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';

    const auroraX = cx + Math.sin(t * 0.11) * W * 0.16;
    const auroraY = H * 0.24 + Math.cos(t * 0.09) * H * 0.05;
    const r = Math.max(W, H) * 0.6;
    const a = ctx.createRadialGradient(auroraX, auroraY, 0, auroraX, auroraY, r);
    a.addColorStop(0, 'rgba(24,104,96,0.085)');
    a.addColorStop(0.5, 'rgba(16,66,74,0.04)');
    a.addColorStop(1, 'rgba(8,20,30,0)');
    ctx.fillStyle = a;
    ctx.beginPath();
    ctx.arc(auroraX, auroraY, r, 0, TAU);
    ctx.fill();

    const spr = getSnowSprite();
    for (let i = 0; i < stars.length; i += 2) {
      const s = stars[i];
      const tw = 0.5 + 0.5 * Math.sin(t * s.speed + s.phase);
      const al = s.a * tw * 0.55;
      if (al < 0.04) continue;
      const size = s.r * 7;
      ctx.globalAlpha = al;
      ctx.drawImage(spr, s.x - size / 2, s.y - size / 2, size, size);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawTree(t, grow) {
    const cosY = Math.cos(rotY);
    const sinY = Math.sin(rotY);
    const cosT = Math.cos(tilt);
    const sinT = Math.sin(tilt);

    let n = 0;
    for (let s = 0; s < strandBuf.length; s++) strandBuf[s].length = 0;
    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      const v = view[i];
      const gp = clamp((grow - p.delay) / 0.58, 0, 1);
      if (gp <= 0) {
        v.alpha = 0;
        continue;
      }
      const rise = smooth(gp);
      const y = p.y * rise - 0.02 * (1 - rise);
      const pr = project(p.x, y, p.z, cosY, sinY, cosT, sinT);
      v.sx = pr.sx;
      v.sy = pr.sy;
      v.z = pr.z;
      v.k = pr.k;
      v.alpha = p.alpha * rise;
      v.size = p.size * pr.k * (0.82 + 0.34 * (0.5 + 0.5 * Math.sin(t * p.speed + p.phase)));
      if (p.kind === 0) {
        const acc = p.accentHue !== null;
        v.hue = acc ? p.accentHue : p.hue;
        v.sprite = hueSprite(v.hue, acc ? 90 : 78, acc ? 62 : 58);
        if (acc) {
          v.size *= 1.25;
          v.alpha = Math.min(1, v.alpha * 1.2);
        }
        const buf = strandBuf[p.strand];
        buf.push(v.sx, v.sy, v.alpha);
      } else if (p.kind === 2) {
        v.sprite = rgbSprite(ORNAMENT_RGB[p.colorIndex]);
        v.alpha *= 0.78 + 0.22 * Math.sin(t * p.speed + p.phase);
      } else {
        v.sprite = hueSprite(p.hue, 46, 38);
      }
      n++;
    }

    const visible = view;
    const baseY = project(0, -0.53, 0, cosY, sinY, cosT, sinT).sy;
    const topY = project(0, 0.53, 0, cosY, sinY, cosT, sinT).sy;

    ctx.globalCompositeOperation = 'lighter';
    for (let s = 0; s < strandBuf.length; s++) {
      const buf = strandBuf[s];
      if (buf.length < 6) continue;
      ctx.beginPath();
      ctx.moveTo(buf[0], buf[1]);
      for (let i = 3; i < buf.length; i += 3) ctx.lineTo(buf[i], buf[i + 1]);
      const h = STRAND_HUES[s];
      const lg = ctx.createLinearGradient(0, baseY, 0, topY);
      lg.addColorStop(0, `hsla(${h},76%,64%,0.025)`);
      lg.addColorStop(0.35, `hsla(${h},74%,62%,0.085)`);
      lg.addColorStop(0.78, `hsla(${h},72%,66%,0.06)`);
      lg.addColorStop(1, `hsla(${h},70%,72%,0.03)`);
      ctx.strokeStyle = lg;
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }

    for (let i = 0; i < visible.length; i++) {
      const v = visible[i];
      if (v.alpha <= 0.004 || v.size < 0.35) continue;
      const s = v.size;
      if (v.sx + s < 0 || v.sx - s > W || v.sy + s < 0 || v.sy - s > H) continue;
      ctx.globalAlpha = Math.min(1, v.alpha);
      ctx.drawImage(v.sprite, v.sx - s / 2, v.sy - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function starPath(x, y, R, r) {
    ctx.beginPath();
    for (let i = 0; i < 8; i++) {
      const ang = i * (Math.PI / 4) - Math.PI / 2;
      const rad = i % 2 === 0 ? R : r;
      const px = x + Math.cos(ang) * rad;
      const py = y + Math.sin(ang) * rad;
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function drawStar(t, grow) {
    const cosY = Math.cos(rotY);
    const sinY = Math.sin(rotY);
    const cosT = Math.cos(tilt);
    const sinT = Math.sin(tilt);
    const pr = project(0, TREE_TOP + 0.015, 0, cosY, sinY, cosT, sinT);
    const appear = clamp((grow - 0.66) / 0.34, 0, 1);
    if (appear <= 0) return;

    const pulse = 0.9 + 0.1 * Math.sin(t * 2.4) + flash * 0.35;
    const R = scale * 0.057 * pulse * appear;

    ctx.globalCompositeOperation = 'lighter';

    const g = ctx.createRadialGradient(pr.sx, pr.sy, 0, pr.sx, pr.sy, R * (5.2 + flash * 3));
    g.addColorStop(0, `rgba(255,248,222,${0.5 * appear})`);
    g.addColorStop(0.22, `rgba(255,214,132,${0.24 * appear})`);
    g.addColorStop(0.55, `rgba(255,176,84,${0.08 * appear})`);
    g.addColorStop(1, 'rgba(255,160,60,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(pr.sx, pr.sy, R * (5.2 + flash * 3), 0, TAU);
    ctx.fill();

    ctx.save();
    ctx.shadowColor = 'rgba(255,206,110,0.95)';
    ctx.shadowBlur = R * 2.4;
    ctx.fillStyle = `rgba(255,251,235,${0.95 * appear})`;
    starPath(pr.sx, pr.sy, R, R * 0.16);
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = `rgba(255,236,186,${0.55 * appear})`;
    ctx.lineWidth = Math.max(0.7, R * 0.045);
    ctx.beginPath();
    ctx.moveTo(pr.sx - R * 2.7, pr.sy);
    ctx.lineTo(pr.sx + R * 2.7, pr.sy);
    ctx.moveTo(pr.sx, pr.sy - R * 2.7);
    ctx.lineTo(pr.sx, pr.sy + R * 2.7);
    ctx.stroke();

    ctx.strokeStyle = `rgba(255,226,160,${0.28 * appear})`;
    ctx.lineWidth = Math.max(0.6, R * 0.035);
    const diag = R * 1.7;
    ctx.beginPath();
    ctx.moveTo(pr.sx - diag * 0.7, pr.sy - diag * 0.7);
    ctx.lineTo(pr.sx + diag * 0.7, pr.sy + diag * 0.7);
    ctx.moveTo(pr.sx + diag * 0.7, pr.sy - diag * 0.7);
    ctx.lineTo(pr.sx - diag * 0.7, pr.sy + diag * 0.7);
    ctx.stroke();
    ctx.restore();

    ctx.globalCompositeOperation = 'source-over';
  }

  function drawSnow(t, dt) {
    const spr = getSnowSprite();
    ctx.globalCompositeOperation = 'source-over';
    for (const f of snow) {
      f.y += f.vy * dt * 60;
      f.x += (Math.sin(t * f.speed + f.phase) * f.sway + 5) * dt * 60;
      if (f.y > H + 20) {
        Object.assign(f, makeFlake(false));
      }
      if (f.x < -30) f.x = W + 20;
      if (f.x > W + 30) f.x = -20;
      const s = f.r * 3.2;
      ctx.globalAlpha = f.a;
      ctx.drawImage(spr, f.x - s / 2, f.y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
  }

  function spawnWish() {
    const cxr = Math.cos(rotY);
    const sxr = Math.sin(rotY);
    const ct = Math.cos(tilt);
    const st = Math.sin(tilt);
    for (let i = 0; i < 52; i++) {
      const p = points[(Math.random() * points.length) | 0];
      if (p.kind === 1 && Math.random() < 0.5) continue;
      const pr = project(p.x * 1.08, p.y, p.z * 1.08, cxr, sxr, ct, st);
      const ang = rand(0, TAU);
      const spd = rand(18, 110);
      const warm = Math.random() < 0.55;
      const hue = warm ? rand(34, 50) : Math.random() < 0.6 ? rand(330, 348) : rand(186, 204);
      wishes.push({
        x: pr.sx,
        y: pr.sy,
        vx: Math.cos(ang) * spd * 0.6,
        vy: -rand(40, 190),
        life: rand(1.1, 2.2),
        size: rand(2.2, 5.4),
        hue
      });
    }
    flash = 0.72;
    hint.classList.add('fade');
  }

  function drawWishes(dt) {
    if (!wishes.length) return;
    ctx.globalCompositeOperation = 'lighter';
    for (let i = wishes.length - 1; i >= 0; i--) {
      const w = wishes[i];
      w.life -= dt;
      if (w.life <= 0) {
        wishes.splice(i, 1);
        continue;
      }
      w.vy += 55 * dt;
      w.vx *= 0.992;
      w.x += w.vx * dt;
      w.y += w.vy * dt;
      const a = clamp(w.life / 0.7, 0, 1) * 0.9;
      const spr = hueSprite(w.hue, 88, 70);
      const s = w.size * 4.4;
      ctx.globalAlpha = a;
      ctx.drawImage(spr, w.x - s / 2, w.y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  function applyBloom() {
    if (bloom.width < 2 || bloom.height < 2) return;
    bctx.clearRect(0, 0, bloom.width, bloom.height);
    bctx.filter = 'blur(2.2px)';
    bctx.drawImage(canvas, 0, 0, bloom.width, bloom.height);
    bctx.filter = 'none';

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.62 + flash * 0.3;
    ctx.drawImage(bloom, 0, 0, W, H);
    ctx.restore();
  }

  let last = performance.now();
  let time = 0;

  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;
    time += dt;

    if (!dragging) {
      spinVel += (AUTO_SPIN - spinVel) * Math.min(1, dt * 1.1);
      rotY += spinVel * dt;
      tilt += (0.09 + pointerY * 0.05 - tilt) * Math.min(1, dt * 1.5);
    }

    flash = Math.max(0, flash - dt * 1.8);

    const grow = clamp((now - START) / 2500, 0, 1);

    drawBackground(time);
    drawTree(time, grow);
    drawStar(time, grow);
    applyBloom();
    drawSnow(time, dt);
    drawWishes(dt);

    if (flash > 0.01) {
      ctx.globalCompositeOperation = 'lighter';
      const fg = ctx.createRadialGradient(cx, cy, 0, cx, cy, scale * 1.1);
      fg.addColorStop(0, `rgba(255,226,170,${0.09 * flash})`);
      fg.addColorStop(0.6, `rgba(255,190,110,${0.03 * flash})`);
      fg.addColorStop(1, 'rgba(255,170,80,0)');
      ctx.fillStyle = fg;
      ctx.fillRect(0, 0, W, H);
      ctx.globalCompositeOperation = 'source-over';
    }

    requestAnimationFrame(frame);
  }

  function onPointerDown(e) {
    dragging = true;
    moved = false;
    lastX = e.clientX;
    lastY = e.clientY;
    canvas.classList.add('dragging');
    canvas.setPointerCapture?.(e.pointerId);
  }

  function onPointerMove(e) {
    pointerX = e.clientX / W - 0.5;
    pointerY = e.clientY / H - 0.5;
    if (!dragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;
    if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
    rotY += dx * 0.0085;
    spinVel = clamp(dx * 0.5, -3.4, 3.4);
    tilt = clamp(tilt + dy * 0.0022, -0.06, 0.42);
  }

  function onPointerUp(e) {
    if (!dragging) return;
    dragging = false;
    canvas.classList.remove('dragging');
    canvas.releasePointerCapture?.(e.pointerId);
    if (!moved) spawnWish();
    spinVel = clamp(spinVel, -1.6, 1.6);
  }

  window.addEventListener('resize', resize);
  canvas.addEventListener('pointerdown', onPointerDown);
  canvas.addEventListener('pointermove', onPointerMove);
  canvas.addEventListener('pointerup', onPointerUp);
  canvas.addEventListener('pointercancel', onPointerUp);

  buildTree();
  resize();
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
